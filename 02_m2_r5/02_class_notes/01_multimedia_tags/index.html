<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>video tag</h1>

<video src="./Data/Demo Video.mp4">

</video>

<!-- controls attribute -->
<video src="./Data/Demo Video.mp4" controls>

</video>

<!-- height and width attribute -->
<video src="./Data/Demo Video.mp4" controls width="200px">
</video>

<!-- <video src="./Data/Demo Video.mp4" controls width="200px" height="800px">
</video>  -->


<!-- loop attribute -->
<video src="./Data/Demo Video.mp4" controls width="400px" loop>
</video>

<!-- poster attribute -->
<video src="./Data/Demo Video.mp4" controls width="400px" loop poster="./Data/PosterImage.jpeg">
</video>


<h1>audio tag</h1>

<audio src="./Data/Demo Audio .mp3" controls>
</audio>

<!-- source tag -->
<audio controls>
<source src="./Data/Demo Audio .mp3" type="audio/mpeg">
</audio>
<!-- loop attribute -->
<audio src="./Data/Demo Audio .mp3" controls loop>
</audio>

<!-- muted attribute -->
<audio src="./Data/Demo Audio .mp3" controls loop muted>
</audio>

<!-- autoplay -->

<!-- <audio src="./Data/Demo Audio .mp3" controls autoplay>
</audio> -->



<h1>image tag</h1>
<!-- local image -->
 <img src="./Data/Demo Image.jpg">

<!-- online image -->
 <img src="https://images.unsplash.com/photo-1565315527461-d1d090885aed?q=80&w=1023&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">


 <!--alt attribute  -->
<img src="./Data/Demo Image34.jpg" alt="this a spiderman">

<!-- height and width -->
<img src="./Data/Demo Image.jpg" alt="this a spiderman" height="200px">

<img src="./Data/Demo Image.jpg" alt="this a spiderman" width="200px">

<img src="./Data/Demo Image.jpg" alt="this a spiderman" width="200px" height="500px">   <!-- not recommended -->

<!-- title attribute -->
 <img src="./Data/Demo Image.jpg" alt="this a spiderman" width="200px" title="this is a spiderman image">

<!-- border attribute -->
<img src="./Data/Demo Image.jpg" alt="this a spiderman" width="200px" border="10">
</body>
</html>
