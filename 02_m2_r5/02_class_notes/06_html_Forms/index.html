<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HTML FORMS </title>
</head>
<body>
    <h1>Html Forms</h1>

    <form action="./thank.html" method="" target="_blank" novalidate autocomplete="off" name="myform">
        <input type="text"> <br> <br>

        
        <label for="p"> password : </label>
        <input type="password" id="p"> <br> <br>

        <label for="e"> email : </label>
        <input type="email" id="e" value="wca@gmail.com"> <br> <br>

        <label for="a"> age : </label>
        <input type="number" id="a" max="35" min="18"> <br> <br>

        <label for="d"> DOB : </label>
        <input type="date" id="d"> <br> <br>

        <label for="t"> entry time : </label>
        <input type="time" id="t" name="time"> <br> <br>

        <label for="r1"> male : </label>
        <input type="radio" id="r1" name="gender"> <br> <br>

        <label for="r2"> female : </label>
        <input type="radio" id="r2" name="gender"> <br> <br>


        <label for="c1"> html </label>
        <input type="checkbox" id="c1" checked> <br> <br>
        <label for="c2"> css </label>
        <input type="checkbox" id="c2"> <br> <br>
        <label for="c3"> js </label>
        <input type="checkbox" id="c3" checked> <br> <br>

        <label for="co"> color : </label>
        <input type="color" id="co"> <br> <br>

        <label for="im"> profile photo : </label>
        <input type="file" id="im" accept=".jpg" multiple> <br> <br>

        <input type="submit" name="" value="submit data"> <br> <br>

        <input type="reset" name="" value="reset form data"> <br> <br>
        <input type="range" min="10" max="50">


        <select name="" id="">
            <option value="html">html</option>
            <option value="css">css</option>
            <option value="">js</option>
        </select>

        <select name="" id="">
            <optgroup label="m2r5">
            <option value="">html</option>
            <option value="">css</option>
            <option value="">js</option>
            </optgroup>
            <optgroup label="m1r5">
                <option value="">word</option>
                <option value="">excel</option>
                <option value="">powerpoint</option>
            </optgroup>
        </select>

        <br><br>

        <label for="">
            feedback
        </label>
        <br><br>
        <textarea name="" id="" rows="30" cols="50" placeholder="writy ur feedback">
        </textarea>

    </form>






</body>
</html>
