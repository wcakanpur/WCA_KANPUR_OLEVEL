<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nested frame task</title>
</head>

<frameset rows="*,*">
    <frame name="fram1">
    <frameset cols="*,*,*">
        <frame name="frame2">
        <frame name="frame3">
        <frameset rows="*,*,*">
            <frame name="frame4">
            <frame name="frame5">
            <frameset cols="*,*,*,*">
                <frame name="frame6">
                <frameset rows="*,*">
                    <frame name="frame6.1">
                    <frame name="frame6.2">

                </frameset>
                <frame name="frame7">
                <frameset rows="*,*">
                    <frame name="frame7.1">
                    <frame name="frame7.2">
                </frameset>
            </frameset>
        </frameset>

    </frameset>

</frameset>
</html>
